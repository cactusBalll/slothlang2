[book]
title = "sloth-lang 2.0 语言指南"
authors = ["slothlang2"]
description = "基于 slothlang2 当前实现的 sloth-lang 2.0 语言指南（示例附对应 MLIR）"
language = "zh-CN"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
mathjax-support = true
# smart punctuation 会把 `--` / `...` / 直引号改写为印刷符号，破坏 MathJax 公式，
# 因此与 MathJax 同时使用时必须关闭（见 mdBook 文档）。
smart-punctuation = false

[output.html.fold]
enable = true
level = 1
