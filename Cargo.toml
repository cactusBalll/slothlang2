[workspace]
resolver = "2"
members = [
    "crates/sloth-frontend",
    "crates/sloth-codegen",
    "crates/sloth-rt",
    "crates/slothc",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mlir-sys = "=210.0.4"
libc = "0.2"

[profile.release]
debug = true
